    <body>
        <style>
            .no-select {
                -webkit-user-select: none;
                user-select: none;
            }
        </style>

        <div
            x-data="customPlayer()"
            x-ref="playerContainer"
            @mousemove="resetControlsTimeout"
            @touchstart.passive="resetControlsTimeout"
            @mouseleave="hideControls"
            class="relative w-full h-[100svh] mx-auto bg-black overflow-hidden font-sans text-white shadow-2xl transition-all duration-300 no-select"
            :class="{ 'rounded-none': isFullscreen, 'rounded-none': !isFullscreen, 'cursor-none': !showControls }"
            dir="ltr"
        >
            <video
                x-ref="videoPlayer"
                @loadedmetadata="initVideo"
                @timeupdate="updateProgress"
                @ended="isPlaying = false; showControls = true;"
                @click="handleVideoClick"
                class="absolute inset-0 object-contain w-full h-full bg-black"
                poster="https://image.tmdb.org/t/p/original/reEMJA1uzscCbkpeRJeTT2bjqUp.jpg"
                playsinline
                webkit-playsinline
            >
                <source
                    src="https://www.w3schools.com/html/mov_bbb.mp4"
                    type="video/mp4"
                />

                <track
                    label="فارسی"
                    kind="subtitles"
                    srclang="fa"
                    src="path_to_subtitle.vtt"
                    default
                />
                <track
                    label="English"
                    kind="subtitles"
                    srclang="en"
                    src="path_to_english.vtt"
                />
            </video>

                        <svg
                            class="w-5 h-5 text-white md:w-6 md:h-6"
                            fill="none"
                            viewBox="0 0 24 24"

                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path

                                    fill="white"
                                />
                            </svg>
                        </button>

                        <button
                            @click.stop="openMenu('speed')"
                            class="transition-all hover:scale-110 hover:text-white/80"
                        >
                            <svg
                                class="w-6 h-6 md:w-7 md:h-7"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM7.45999 14.62C7.66999 14.98 7.55 15.43 7.19 15.65C7.07 15.72 6.94 15.75 6.81 15.75C6.55 15.75 6.3 15.62 6.16 15.38C5.57 14.37 5.25 13.2 5.25 12C5.25 8.28 8.28 5.25 12 5.25C12.49 5.25 12.96 5.3 13.46 5.41C13.86 5.49 14.12 5.88999 14.03 6.29999C13.95 6.69999 13.55 6.96 13.14 6.87C9.81001 6.16 6.75 8.72 6.75 12C6.75 12.95 6.98999 13.83 7.45999 14.62ZM15.54 8.87C14.82 10.2 13.48 12.64 13.06 13.06C12.47 13.65 11.53 13.65 10.94 13.06C10.35 12.47 10.35 11.53 10.94 10.94C11.36 10.52 13.8 9.17999 15.13 8.45999C15.4 8.31999 15.68 8.6 15.54 8.87ZM17.84 15.38C17.7 15.62 17.45 15.75 17.19 15.75C17.06 15.75 16.93 15.72 16.81 15.65C16.45 15.43 16.33 14.98 16.54 14.62C17.01 13.83 17.25 12.95 17.25 12C17.25 11.62 17.21 11.24 17.13 10.86C17.04 10.45 17.3 10.05 17.7 9.97C18.11 9.88 18.51 10.14 18.59 10.54C18.7 11.03 18.75 11.51 18.75 12C18.75 13.2 18.43 14.37 17.84 15.38Z"
                                    fill="white"
                                />

                        </button>

                        <button
                            @click="toggleFullscreen"
                            class="text-white transition-all hover:scale-110 hover:text-white/80"
                        >
                            <svg
                                x-show="!isFullscreen"
                                class="w-6 h-6 md:w-7 md:h-7"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                    fill="white"
                                />
                            </svg>

                            <svg
                                x-show="isFullscreen"
                                style="display: none"

                                height="24"
                                viewBox="0 0 24 24"

                    </div>
                </div>
            </div>

            <div
                x-show="showSpeedMenu || showQualityMenu || showCcMenu || showEpisodesMenu"
                x-transition.opacity.duration.300ms
                class="absolute inset-0 z-[60] bg-[#00000080] backdrop-blur-md flex items-center justify-center pointer-events-auto"
                @click="closeMenus()"
            >
                <div
                    x-show="showEpisodesMenu"
                    @click.stop
                    class="w-full max-w-[850px] px-6 md:px-10 flex flex-col font-sans max-h-[95vh] md:max-h-[75vh] [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]"
                    dir="rtl"
                >
                    <div class="flex items-center justify-between px-2 mb-10">
                        <span
                            class="text-base font-bold md:text-3xl text-white/90"
                            x-text="`(${episodes.length})`"
                        ></span>
                        <h3
                            class="text-2xl font-bold md:text-4xl drop-shadow-md"
                        >
                            <span class="text-[#DD0202]">LaCasa</span> De Papel
                        </h3>
                    </div>

                    <div
                        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-5 overflow-y-auto pb-4 pr-3 [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-white/5 [&::-webkit-scrollbar-thumb]:bg-white/20 [&::-webkit-scrollbar-thumb]:rounded-full"
                    >
                        <template x-for="ep in episodes" :key="ep">
                            <button
                                @click="currentEpisode = ep; closeMenus();"
                                class="relative p-[1px] rounded-[5rem] overflow-hidden group border transition-all duration-300"
                                :class="currentEpisode === ep ? 'bg-[#DD020229] border-[#ED1C24]' : 'bg-[#4A4A4A80] border-[#FFFFFF4A]'"
                            >
                                <div
                                    class="w-full h-14 md:h-16 rounded-[5rem] flex items-center justify-center text-[15px] md:text-base font-medium transition-colors duration-300"
                                    :class="currentEpisode === ep ? 'bg-[#DD020229] text-white' : 'bg-[#4A4A4A80] text-gray-200 group-hover:text-white group-hover:bg-[#5A5A5A80]'"
                                >
                                    <span x-text="`قسمت ${ep}`"></span>
                                </div>
                            </button>
                        </template>
                    </div>
                </div>

                <div
                    x-show="showSpeedMenu"
                    @click.stop
                    class="bg-[#171717CC] w-[280px] md:w-[320px] max-h-[95vh] rounded-3xl overflow-hidden shadow-2xl border border-white/10 flex flex-col font-sans overflow-y-auto overflow-x-hidden [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]"
                    dir="rtl"
                >
                    <div
                        class="py-4 text-base font-bold text-center text-white border-b border-white/10 md:text-lg"
                    >
                        سرعت پخش
                    </div>
                    <div class="flex flex-col py-3">
                        <template x-for="rate in playbackRates" :key="rate">
                            <button
                                @click="setSpeed(rate)"
                                class="relative w-full py-3.5 flex items-center justify-center hover:bg-white/5 transition-colors group cursor-pointer"
                            >
                                <span
                                    class="text-[15px] md:text-base transition-colors"
                                    :class="playbackRate === rate ? 'text-white drop-shadow-md' : 'text-gray-400 group-hover:text-gray-200'"
                                    x-text="rate + 'X'"
                                ></span>
                                <svg
                                    x-show="playbackRate === rate"
                                    class="absolute w-5 h-5 text-white right-6"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M5 13l4 4L19 7"
                                    />
                                </svg>
                            </button>
                        </template>
                    </div>
                </div>

                <div
                    x-show="showQualityMenu"
                    @click.stop
                    class="bg-[#171717CC] w-[280px] md:w-[320px] max-h-[95vh] rounded-3xl overflow-hidden shadow-2xl border border-white/10 flex flex-col font-sans overflow-y-auto overflow-x-hidden [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]"
                    dir="rtl"
                >
                    <div
                        class="py-4 text-base font-bold text-center text-white border-b border-white/10 md:text-lg"
                    >
                        کیفیت پخش
                    </div>
                    <div class="flex flex-col py-3">
                        <template
                            x-for="quality in qualityOptions"
                            :key="quality"
                        >
                            <button
                                @click="setQuality(quality)"
                                class="relative w-full py-3.5 flex items-center justify-center hover:bg-white/5 transition-colors group cursor-pointer"
                            >
                                <span
                                    class="text-[15px] md:text-base transition-colors"
                                    :class="currentQuality === quality ? 'text-white drop-shadow-md' : 'text-gray-400 group-hover:text-gray-200'"
                                    x-text="quality"
                                ></span>
                                <svg
                                    x-show="currentQuality === quality"
                                    class="absolute w-5 h-5 text-white right-6"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M5 13l4 4L19 7"
                                    />
                                </svg>
                            </button>
                        </template>
                    </div>
                </div>

                <div
                    x-show="showCcMenu"
                    @click.stop
                    class="bg-[#171717CC] w-[320px] md:w-[400px] max-h-[95vh] rounded-[30px] shadow-2xl border border-white/10 flex flex-col font-sans px-5 py-8 gap-5 overflow-y-auto overflow-x-hidden [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]"
                    dir="rtl"
                >
                    <div class="pb-4 border-b border-white/10">
                        <div
                            class="text-[13px] md:text-sm font-semibold text-gray-300 mb-3 text-right"
                        >
                            زیرنویس
                        </div>
                        <div
                            class="flex flex-wrap items-center justify-start gap-2"
                        >
                            <template x-for="lang in ccLangs" :key="lang">
                                <button
                                    @click="setCcLang(lang)"
                                    class="px-4 py-1.5 rounded-full text-[13px] md:text-sm font-medium transition-all"
                                    :class="ccLang === lang ? 'text-white bg-[linear-gradient(179deg,#ED1C24_0.86%,rgba(153,0,6,0.76)_99.14%)]' : 'border border-white/30 text-white/80 hover:border-white hover:text-white'"
                                    x-text="lang"
                                ></button>
                            </template>
                        </div>
                    </div>
                    <div class="pb-4 border-b border-white/10">
                        <div
                            class="text-[13px] md:text-sm font-semibold text-gray-300 mb-3 text-right"
                        >
                            اندازه زیرنویس
                        </div>
                        <div
                            class="flex flex-wrap items-center justify-start gap-2"
                        >
                            <template x-for="size in ccSizes" :key="size">
                                <button
                                    @click="setCcStyle('size', size)"
                                    class="px-3 py-1 md:px-4 md:py-1.5 rounded-full text-[13px] md:text-sm font-medium transition-all"
                                    :class="ccSize === size ? 'text-white bg-[linear-gradient(179deg,#ED1C24_0.86%,rgba(153,0,6,0.76)_99.14%)]' : 'border border-white/30 text-white/80 hover:border-white hover:text-white'"
                                    x-text="size"
                                ></button>
                            </template>
                        </div>
                    </div>
                    <div class="pb-4 border-b border-white/10">
                        <div
                            class="text-[13px] md:text-sm font-semibold text-gray-300 mb-3 text-right"
                        >
                            رنگ زیرنویس
                        </div>
                        <div
                            class="flex flex-wrap items-center justify-start gap-2"
                        >
                            <template x-for="color in ccColors" :key="color">
                                <button
                                    @click="setCcStyle('color', color)"
                                    class="px-3 py-1 md:px-4 md:py-1.5 rounded-full text-[13px] md:text-sm font-medium transition-all"
                                    :class="ccColor === color ? 'text-white bg-[linear-gradient(179deg,#ED1C24_0.86%,rgba(153,0,6,0.76)_99.14%)]' : 'border border-white/30 text-white/80 hover:border-white hover:text-white'"
                                    x-text="color"
                                ></button>
                            </template>
                        </div>
                    </div>
                    <div>
                        <div
                            class="text-[13px] md:text-sm font-semibold text-gray-300 mb-3 text-right"
                        >
                            پس زمینه زیرنویس
                        </div>
                        <div
                            class="flex flex-wrap items-center justify-start gap-2"
                        >
                            <template x-for="bg in ccBgs" :key="bg">
                                <button
                                    @click="setCcStyle('bg', bg)"
                                    class="px-3 py-1 md:px-4 md:py-1.5 rounded-full text-[13px] md:text-sm font-medium transition-all"
                                    :class="ccBg === bg ? 'text-white bg-[linear-gradient(179deg,#ED1C24_0.86%,rgba(153,0,6,0.76)_99.14%)]' : 'border border-white/30 text-white/80 hover:border-white hover:text-white'"
                                    x-text="bg"
                                ></button>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="public/assets/js/player.js"></script>
    </body>
</html>
