<!doctype html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ page_title }}</title>
        {% load static %}
        <link rel="stylesheet" href="{% static 'dist/assets/css/main.css' %}" />
        <script defer src="{% static 'public/assets/js/alpine.min.js' %}"></script>
    </head>
    <body class="relative overflow-x-hidden bg-black">
        <!-- red circle -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute bg-red-500 rounded-full -right-50 size-80 top-50 blur-[150px]"></div>
            <div class="absolute bg-red-500 rounded-full -left-80 size-80 top-200 blur-[170px]"></div>
        </div>
        <!-- red circle -->

        <div
            class="w-full g-[#030000f2] backdrop-blur-[4px] min-h-screen text-white font-sans items-center pt-10 md:pt-14 px-4 md:px-8 relative overflow-x-hidden"
            dir="rtl"
            x-data='{ 
        selected: [], 
        isSubmitting: false,
        toggle(id) {
            if (this.selected.includes(id)) {
                this.selected = this.selected.filter(i => i !== id);
            } else {
                this.selected.push(id);
            }
        },
        movies: {{ items_json|safe }},
        async submitSelection() {
            if (this.selected.length < 3) return;
            this.isSubmitting = true;
            try {
                const res = await fetch("{% url 'core:api_selection_submit' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    body: JSON.stringify({ selections: this.selected })
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = data.redirect_url || "/";
                } else {
                    alert(data.error);
                }
            } catch (e) {
                alert("مشکل در ارتباط با سرور");
            } finally {
                this.isSubmitting = false;
            }
        }
     }'

        <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        </script>
